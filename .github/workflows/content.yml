name: Akshara Aata Gemini content

# Writes a short Kannada line for each letter with Gemini and speaks it with
# Sarvam (GEMINI_API_KEY / GEMINI_API_KEYP and SARVAM_API_KEY secrets).
# The keys stay here; the app only ships the finished lines and recordings.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy soundfile
      - name: Write and speak
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEYP }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python3 tool/gemini_content.py out
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          tar czf ../gemini-lines.tgz out
          gh release upload akshara-aata-voice-keep ../gemini-lines.tgz --clobber -R "$GITHUB_REPOSITORY"
